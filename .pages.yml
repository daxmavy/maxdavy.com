# Pages CMS (https://app.pagescms.org) editor config.
# Saving in the editor commits to main, which triggers the GitHub Pages deploy.

settings:
  content:
    # Keep front matter keys that aren't listed below (e.g. publications, news).
    merge: true

media:
  input: static/images
  output: /images

content:
  - name: home
    label: Home
    type: file
    path: content/_index.md
    format: yaml-frontmatter
    fields:
      - { name: affiliation, type: string }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }

  - name: msc-advice
    label: MSc advice
    type: file
    path: content/msc-advice/index.md
    format: yaml-frontmatter
    fields:
      - { name: title, type: string }
      - { name: description, type: string }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }

  # Bio and Research use footnotes and Hugo shortcodes, which a WYSIWYG
  # round-trip can mangle, so their text is edited as plain Markdown.
  - name: bio
    label: Bio
    type: file
    path: content/bio/index.md
    format: yaml-frontmatter
    fields:
      - { name: title, type: string }
      - { name: body, label: Text (Markdown), type: text }

  - name: research
    label: Research
    type: file
    path: content/research/index.md
    format: yaml-frontmatter
    fields:
      - { name: research_interests, label: Research interests (Markdown), type: text }
      - { name: random_interests, label: Random interests, type: string, list: true }
      - { name: body, label: Text (Markdown), type: text }

  - name: maximalism
    label: Maximalism
    type: file
    path: content/maximalism/index.md
    format: yaml-frontmatter
    fields:
      - { name: title, type: string }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }

  - name: posts
    label: Blog posts
    type: collection
    path: content/blog/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, type: string, required: true }
      - { name: date, type: date, options: { format: yyyy-MM-dd } }
      - { name: draft, type: boolean }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }
